<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypermedia Kampung Adat Bena - Warisan Budaya NTT</title>
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #f4f4f4;
            --accent: #c0392b;
            --text: #111;
            --bg: #fff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        nav button {
            background: none;
            border: 2px solid white;
            color: white;
            padding: 0.5rem 1rem;
            margin: 0.2rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.3s;
        }
        nav button:hover, nav button.active {
            background-color: var(--accent);
            border-color: var(--accent);
        }
        .breadcrumb {
            padding: 1rem;
            background-color: #eee;
            font-size: 0.9rem;
            border-bottom: 2px solid #ccc;
        }
        .breadcrumb span {
            cursor: pointer;
            color: var(--accent);
            text-decoration: underline;
        }
        main {
            padding: 2rem;
            max-width: 1200px;
            margin: auto;
            min-height: 60vh;
        }
        .hero {
            position: relative;
            margin-bottom: 2rem;
            border-radius: 8px;
            overflow: hidden;
        }
        .hero img { width: 100%; height: 400px; object-fit: cover; display: block; }
        .hero-text {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7); color: white; padding: 1.5rem;
        }
        .hero-text h2 { margin: 0 0 0.5rem 0; font-size: 2rem; }
        .filter-bar {
            display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
        }
        .filter-btn {
            background-color: #eee; color: var(--text);
            border: 2px solid #ccc; padding: 0.5rem 1rem;
            border-radius: 20px; cursor: pointer;
            font-weight: bold; transition: 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent); color: white; border-color: var(--accent);
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }
        .gallery-item {
            position: relative; border-radius: 8px; overflow: hidden;
            cursor: pointer; height: 220px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover; transition: 0.3s;
        }
        .gallery-item:hover img { filter: brightness(0.7); }
        .gallery-caption {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: white; padding: 1rem 0.8rem 0.5rem 0.8rem;
            font-weight: bold; font-size: 0.95rem;
        }
        .lightbox {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center; align-items: center;
            z-index: 2000; flex-direction: column;
            padding: 2rem; box-sizing: border-box;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 90%; max-height: 65vh;
            border-radius: 8px; border: 3px solid white;
        }
        .lightbox-info {
            color: white; text-align: center;
            margin-top: 1rem; max-width: 700px;
        }
        .lightbox-info h3 { margin: 0.5rem 0; color: #ffcc00; }
        .lightbox-close {
            position: absolute; top: 20px; right: 30px;
            font-size: 2.5rem; color: white; cursor: pointer; font-weight: bold;
        }
        .lightbox-close:hover { color: var(--accent); }
        .lightbox-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 3rem; color: white; cursor: pointer;
            padding: 1rem; user-select: none;
        }
        .lightbox-nav:hover { color: var(--accent); }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
        .info-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem; margin-top: 1.5rem;
        }
        .info-card {
            border: 2px solid #ccc; border-radius: 8px; overflow: hidden;
            display: flex; flex-direction: column; background: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .info-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .info-card img { width: 100%; height: 200px; object-fit: cover; }
        .info-card-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .kamus-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .kamus-table th, .kamus-table td { border: 1px solid #ccc; padding: 0.8rem; text-align: left; }
        .kamus-table th { background-color: var(--primary); color: white; }
        .kamus-table tr:nth-child(even) { background-color: #f9f9f9; }
        .map-container {
            width: 100%; height: 450px; border: 2px solid #ccc;
            border-radius: 8px; overflow: hidden; margin-top: 1rem;
        }
        .map-container iframe { width: 100%; height: 100%; border: none; }
        .btn-action {
            background-color: var(--accent); color: white; border: none;
            padding: 0.7rem 1.2rem; border-radius: 4px; cursor: pointer;
            font-weight: bold; margin-top: 0.5rem; display: inline-block;
            text-decoration: none; text-align: center;
        }
        .btn-action:hover { background-color: #a93226; }
        .btn-secondary { background-color: #555; }
        .btn-secondary:hover { background-color: #333; }
        .home-btn-container { text-align: center; margin: 2rem 0; }
        .home-btn {
            background-color: var(--primary); color: white;
            padding: 1rem 2rem; border: none; border-radius: 50px;
            font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 2rem; border-radius: 8px;
            max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;
        }
        .modal-content ul { list-style-type: none; padding: 0; }
        .modal-content li {
            padding: 0.5rem 0; border-bottom: 1px solid #eee;
            cursor: pointer; color: var(--accent); font-weight: bold;
        }
        .modal-content li:hover { text-decoration: underline; }
        .close-modal { float: right; cursor: pointer; font-weight: bold; color: red; font-size: 1.5rem; }
        .ai-box {
            background-color: #f9f9f9; border-left: 5px solid var(--accent);
            padding: 1rem; margin-top: 1.5rem; border-radius: 0 8px 8px 0;
        }
    </style>
</head>

    <header>
        <h1>Kampung Adat Bena</h1>
        <nav id="main-nav">

    <div class="breadcrumb" id="breadcrumb">Beranda</div>
    <main id="content"></main>

    <div class="home-btn-container">

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">

            <h3 id="lightbox-title"></h3>
            <p id="lightbox-desc"></p>
            <button class="btn-action" onclick="playAudio(document.getElementById('lightbox-desc').innerText)">🔊 Dengarkan Deskripsi AI</button>
        </div>
    </div>

    <!-- SITEMAP -->
    <div id="sitemap-modal" class="modal">
        <div class="modal-content">

                <li onclick="navigate('peta')">🗺️ Peta Interaktif & SIG</li>
            </ul>
        </div>
    </div>

            'bena-sosial': `

                    <button class="btn-action" onclick="playAudio('Kampung Bena dihuni oleh sembilan suku yang memiliki peran adat masing-masing. Sistem kepemimpinan dipegang oleh kepala suku.')">Putar Penjelasan Audio</button>
                </div>
                <button class="btn-action btn-secondary" style="margin-top:1.5rem;" onclick="navigate('bena')">⬅ Kembali ke Kampung Bena</button>
            `,
            'bena-ritual': `
                <h2>Ritual & Upacara Adat</h2>
                <div class="hero"><img src="gambar/ritual.jpg" onerror="this.src='https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?auto=format&fit=crop&w=1200&q=80'" alt="Ritual Bena"></div>
                <p>Kampung Bena memiliki berbagai ritual sakral yang masih dilaksanakan hingga kini:</p>

                </ul>
                <div class="ai-box">
                    <p><strong>🔊 AI Text-to-Speech (TTS):</strong></p>
                    <button class="btn-action" onclick="playAudio('Upacara Reba adalah pesta panen tahunan di Kampung Bena sebagai ucapan syukur kepada leluhur.')">Putar Penjelasan Audio</button>
                </div>
                <button class="btn-action btn-secondary" style="margin-top:1.5rem;" onclick="navigate('bena')">⬅ Kembali ke Kampung Bena</button>
            `,
            galeri: `
                <h2>Galeri Foto Kampung Adat Bena</h2>
                <p>Klik pada foto untuk melihat versi besar dan mendengarkan deskripsi AI. Gunakan tombol filter untuk menyaring kategori.</p>
                <div class="filter-bar">
                    <button class="filter-btn active" onclick="filterGaleri('semua', this)">Semua</button>
                    <button class="filter-btn" onclick="filterGaleri('arsitektur', this)">Arsitektur</button>
                    <button class="filter-btn" onclick="filterGaleri('alam', this)">Alam</button>
                    <button class="filter-btn" onclick="filterGaleri('ritual', this)">Ritual</button>
                    <button class="filter-btn" onclick="filterGaleri('tarian', this)">Tarian Adat</button>
                    <button class="filter-btn" onclick="filterGaleri('sehari-hari', this)">Sehari-hari</button>
                </div>
                <div class="gallery-grid" id="gallery-grid"></div>
                <div class="ai-box" style="margin-top:2rem;">
                    <p><strong>💡 Tips:</strong> Gunakan tombol panah kiri/kanan pada keyboard Anda untuk navigasi antar foto saat lightbox terbuka.</p>
                </div>
            `,
            bahasa: `
                <h2>Modul Bahasa Ngada & Pelafalan AI</h2>
                <p>Pelajari frasa dasar Bahasa Ngada yang digunakan sehari-hari di Kampung Bena. Klik tombol audio untuk mendengarkan pelafalan yang benar menggunakan teknologi AI Text-to-Speech.</p>
                <table class="kamus-table">
                    <thead>
                        <tr><th>Bahasa Indonesia</th><th>Bahasa Ngada</th><th>Pelafalan</th><th>Konteks</th><th>Aksi (AI TTS)</th></tr>
                    </thead>
                    <tbody id="kamus-body"></tbody>
                </table>
                <div class="ai-box">
                    <p><strong>🤖 AI Neural Machine Translation (NMT):</strong></p>
                    <p>Ingin menerjemahkan kalimat panjang? Ketik di bawah ini:</p>
                    <input type="text" id="input-terjemah" placeholder="Contoh: Selamat pagi, apa kabar?" style="padding:0.5rem; width:60%;">
                    <button class="btn-action" onclick="terjemahkanAI()">Terjemahkan ke Bahasa Ngada</button>
                    <p id="hasil-terjemah" style="margin-top:0.5rem; font-weight:bold; color:var(--accent);"></p>
                </div>
            `,
            peta: `
                <h2>Peta Interaktif & Sistem Informasi Geografis (SIG)</h2>
                <p>Berikut adalah peta lokasi Kampung Adat Bena dan titik-titik penting di sekitarnya.</p>
                <div class="map-container">
                    <iframe src="https://maps.google.com/maps?q=Kampung%20Bena%20Bajawa&t=&z=13&ie=UTF8&iwloc=&output=embed" allowfullscreen="" loading="lazy"></iframe>
                </div>
                <div class="ai-box">
                    <p><strong>📍 Informasi Geografis:</strong></p>
                    <ul>
                        <li><strong>Koordinat:</strong> -8.8333° LS, 120.9833° BT</li>
                        <li><strong>Ketinggian:</strong> 1.200 mdpl</li>
                        <li><strong>Rute Utama:</strong> Bajawa -> Jerebuu -> Kampung Bena (1.5 Jam)</li>
                        <li><strong>Titik Penting:</strong> Gunung Inerie (Utara), Kota Bajawa (Selatan), Mata Air Panas Soa (Timur).</li>
                    </ul>
                    <p><strong>🔊 AI Audio Guide:</strong></p>
                    <button class="btn-action" onclick="playAudio('Peta menunjukkan lokasi Kampung Bena di Kecamatan Jerebuu, Kabupaten Ngada. Gunung Inerie berada tepat di sebelah utara kampung.')">Putar Panduan Audio Peta</button>
                </div>
                <button class="btn-action btn-secondary" style="margin-top:1.5rem;" onclick="navigate('bena')">⬅ Kembali ke Kampung Bena</button>
            `
        };

        let currentFilter = 'semua';
        let currentPhotoIndex = 0;
        let filteredPhotos = [];

        function renderGaleri() {
            const grid = document.getElementById('gallery-grid');
            if (!grid) return;
            const filtered = currentFilter === 'semua' ? galeriData : galeriData.filter(item => item.kategori === currentFilter);
            filteredPhotos = filtered;
            grid.innerHTML = filtered.map((item, index) => `
                <div class="gallery-item" onclick="openLightbox(${index})">
                    <img src="${item.img}" onerror="this.src='${item.fallback}'" alt="${item.judul}" loading="lazy">
                    <div class="gallery-caption">${item.judul}</div>
                </div>
            `).join('');
        }

        function filterGaleri(kategori, btn) {
            currentFilter = kategori;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGaleri();
        }

        function openLightbox(index) {
            currentPhotoIndex = index;
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function updateLightbox() {
            const item = filteredPhotos[currentPhotoIndex];
            if (!item) return;
            const imgEl = document.getElementById('lightbox-img');
            imgEl.src = item.img;
            imgEl.onerror = function() { this.src = item.fallback; };
            document.getElementById('lightbox-title').innerText = item.judul;
            document.getElementById('lightbox-desc').innerText = item.deskripsi;
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto';
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        }

        function changePhoto(direction) {
            currentPhotoIndex += direction;
            if (currentPhotoIndex < 0) currentPhotoIndex = filteredPhotos.length - 1;
            if (currentPhotoIndex >= filteredPhotos.length) currentPhotoIndex = 0;
            updateLightbox();
        }

        document.addEventListener('keydown', function(e) {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.classList.contains('active')) {
                if (e.key === 'ArrowRight') changePhoto(1);
                if (e.key === 'ArrowLeft') changePhoto(-1);
                if (e.key === 'Escape') closeLightbox();
            }
        });

        function renderKamus() {
            const tbody = document.getElementById('kamus-body');
            if (!tbody) return;
            tbody.innerHTML = kamusData.map(item => `
                <tr>
                    <td>${item.indonesia}</td>
                    <td><strong>${item.ngada}</strong></td>
                    <td>${item.pelafalan}</td>
                    <td>${item.konteks}</td>
                    <td><button class="btn-action" style="padding:0.3rem 0.6rem; font-size:0.8rem;" onclick="playAudio('${item.ngada}')">🔊 Dengar</button></td>
                </tr>
            `).join('');
        }

        function terjemahkanAI() {
            const input = document.getElementById('input-terjemah').value;
            const hasil = document.getElementById('hasil-terjemah');
            if (input.trim() === '') {
                hasil.innerText = "Silakan masukkan kalimat terlebih dahulu.";
                return;
            }
            hasil.innerText = `AI Menerjemahkan: "${input}" -> (Dalam pengembangan model Bahasa Ngada)`;
        }

        function navigate(page) {
            const contentDiv = document.getElementById('content');
            const breadcrumbDiv = document.getElementById('breadcrumb');
            if (staticContent[page]) {
                contentDiv.innerHTML = staticContent[page];
                if (page === 'bahasa') renderKamus();
                if (page === 'galeri') { currentFilter = 'semua'; renderGaleri(); }
            } else {
                contentDiv.innerHTML = `<h2>Halaman Tidak Ditemukan</h2><p>Silakan kembali ke Beranda.</p>`;
            }
            let breadcrumbText = '<span onclick="navigate(\'home\')">Beranda</span>';
            if (page === 'profil') breadcrumbText += ' > Profil & Falsafah';
            if (page === 'bena') breadcrumbText += ' > Profil & Falsafah > <span onclick="navigate(\'bena\')">Kampung Adat Bena</span>';
            if (page.startsWith('bena-')) {
                breadcrumbText += ' > Profil & Falsafah > <span onclick="navigate(\'bena\')">Kampung Adat Bena</span>';
                const subPage = page.split('-')[1];
                const subTitles = { 'sejarah': 'Sejarah & Lokasi', 'arsitektur': 'Arsitektur Megalitikum', 'sosial': 'Sistem Sosial 9 Suku', 'ritual': 'Ritual & Upacara Adat' };
                if(subTitles[subPage]) breadcrumbText += ` > ${subTitles[subPage]}`;
            }
            if (page === 'galeri') breadcrumbText += ' > Galeri Kampung Bena';
            if (page === 'bahasa') breadcrumbText += ' > Modul Bahasa Ngada';
            if (page === 'peta') breadcrumbText += ' > Peta Interaktif & SIG';
            breadcrumbDiv.innerHTML = breadcrumbText;
            document.querySelectorAll('#main-nav button').forEach(btn => btn.classList.remove('active'));
            const activeBtn = Array.from(document.querySelectorAll('#main-nav button')).find(b => b.innerText.toLowerCase().includes(page.split('-')[0]));
            if(activeBtn) activeBtn.classList.add('active');
            window.scrollTo(0, 0);
        }

        function openSitemap() { document.getElementById('sitemap-modal').style.display = 'flex'; }
        function closeSitemap() { document.getElementById('sitemap-modal').style.display = 'none'; }

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Browser Anda tidak mendukung fitur AI Text-to-Speech.");
            }
        }

        navigate('home');
    </script>
</body>
</html>
